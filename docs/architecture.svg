<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Opaque background so the diagram stays legible on dark themes too. -->
  <rect width="1080" height="720" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6070"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6df6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f9d63"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="19" font-weight="700" fill="#171a21">Dynamic AI Agent Orchestration Platform</text>
  <text x="24" y="55" font-size="12.5" fill="#666c7c">Goal in, agents designed at runtime inside YAML permission envelopes, equipped with MCP tools, run as a DAG, trace streamed out.</text>

  <!-- ============ Frontend ============ -->
  <rect x="24" y="80" width="230" height="150" rx="10" fill="#f7f8fb" stroke="#c9ccd6"/>
  <text x="40" y="103" font-size="12" font-weight="700" fill="#5b6070">REACT + VITE</text>
  <rect x="40" y="114" width="198" height="26" rx="6" fill="#ffffff" stroke="#e0e2e9"/>
  <text x="50" y="131" font-size="12" fill="#171a21">GoalInput</text>
  <rect x="40" y="146" width="198" height="26" rx="6" fill="#ffffff" stroke="#e0e2e9"/>
  <text x="50" y="163" font-size="12" fill="#171a21">RunGraph · TraceTimeline</text>
  <rect x="40" y="178" width="198" height="26" rx="6" fill="#ffffff" stroke="#e0e2e9"/>
  <text x="50" y="195" font-size="12" fill="#171a21">CostPanel · ApprovalDialog</text>
  <text x="40" y="221" font-size="11" fill="#666c7c">all I/O via api/client.js</text>

  <!-- ============ FastAPI ============ -->
  <rect x="310" y="80" width="240" height="150" rx="10" fill="#f2f6ff" stroke="#2f6df6"/>
  <text x="326" y="103" font-size="12" font-weight="700" fill="#12306f">FASTAPI</text>
  <text x="326" y="126" font-size="11.5" fill="#171a21" font-family="ui-monospace, monospace">POST /runs</text>
  <text x="326" y="145" font-size="11.5" fill="#171a21" font-family="ui-monospace, monospace">GET  /runs/{id}</text>
  <text x="326" y="164" font-size="11.5" fill="#171a21" font-family="ui-monospace, monospace">GET  /runs/{id}/events</text>
  <text x="326" y="183" font-size="11.5" fill="#171a21" font-family="ui-monospace, monospace">POST /runs/{id}/approve</text>
  <text x="326" y="202" font-size="11.5" fill="#171a21" font-family="ui-monospace, monospace">GET  /agents · /tools</text>
  <text x="326" y="221" font-size="11" fill="#666c7c">in-process event bus → SSE</text>

  <path d="M 254 132 L 304 132" stroke="#5b6070" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="258" y="126" font-size="10.5" fill="#666c7c">goal</text>
  <path d="M 304 178 L 254 178" stroke="#1f9d63" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="256" y="193" font-size="10.5" fill="#1f9d63">SSE trace</text>

  <!-- ============ Config registries ============ -->
  <rect x="610" y="80" width="240" height="162" rx="10" fill="#fffaf0" stroke="#c8912a"/>
  <text x="626" y="103" font-size="12" font-weight="700" fill="#7a5a12">CONFIGURATION</text>
  <rect x="626" y="112" width="208" height="56" rx="6" fill="#ffffff" stroke="#f0d9a8"/>
  <text x="636" y="129" font-size="11.5" font-weight="600" fill="#171a21">config/agents.yaml</text>
  <text x="636" y="145" font-size="10.5" fill="#666c7c">capability envelopes: allowed tools ·</text>
  <text x="636" y="159" font-size="10.5" fill="#666c7c">allowed models · limits · policy</text>
  <rect x="626" y="174" width="208" height="38" rx="6" fill="#ffffff" stroke="#f0d9a8"/>
  <text x="636" y="190" font-size="11.5" font-weight="600" fill="#171a21">config/mcp_servers.yaml</text>
  <text x="636" y="205" font-size="10.5" fill="#666c7c">name · transport · command/url</text>
  <text x="626" y="231" font-size="11" font-weight="600" fill="#a12626">no system prompt lives here</text>

  <!-- ============ LangGraph ============ -->
  <rect x="24" y="270" width="826" height="230" rx="10" fill="#fbfbfd" stroke="#c9ccd6"/>
  <text x="40" y="293" font-size="12" font-weight="700" fill="#5b6070">LANGGRAPH · compiled once, topology fixed, plan dynamic</text>

  <rect x="44" y="310" width="150" height="86" rx="8" fill="#e9f0ff" stroke="#2f6df6"/>
  <text x="58" y="331" font-size="13" font-weight="700" fill="#12306f">planner</text>
  <text x="58" y="349" font-size="10.5" fill="#12306f">retrieve capability menu</text>
  <text x="58" y="363" font-size="10.5" fill="#12306f">WRITES an agent per task:</text>
  <text x="58" y="377" font-size="10.5" fill="#12306f">name · role · prompt · tools</text>
  <text x="58" y="391" font-size="10" fill="#8c2320">bad id or tool → retry → fail</text>

  <rect x="222" y="310" width="132" height="86" rx="8" fill="#ffffff" stroke="#5b6070"/>
  <text x="236" y="331" font-size="13" font-weight="700" fill="#171a21">dispatcher</text>
  <text x="236" y="350" font-size="10.5" fill="#5b6070">tasks whose deps</text>
  <text x="236" y="365" font-size="10.5" fill="#5b6070">are satisfied →</text>
  <text x="236" y="380" font-size="10.5" font-weight="600" fill="#5b6070">Send() fan-out</text>
  <text x="236" y="393" font-size="10" fill="#666c7c">re-run every superstep</text>

  <rect x="382" y="300" width="200" height="106" rx="8" fill="#e8f7ef" stroke="#1f9d63"/>
  <text x="396" y="321" font-size="13" font-weight="700" fill="#0f5537">worker  (× N, parallel)</text>
  <text x="396" y="339" font-size="10.5" fill="#0f5537">composer: tools ⊆ envelope?</text>
  <text x="396" y="353" font-size="10.5" fill="#0f5537">policy appended after prompt</text>
  <text x="396" y="367" font-size="10.5" fill="#0f5537">factory: tool loop, max_iterations</text>
  <text x="396" y="381" font-size="10.5" fill="#7a5a12">requires_approval → interrupt()</text>
  <text x="396" y="397" font-size="10" fill="#666c7c">created here, never configured</text>

  <rect x="610" y="310" width="150" height="86" rx="8" fill="#e9f0ff" stroke="#2f6df6"/>
  <text x="624" y="331" font-size="13" font-weight="700" fill="#12306f">synthesizer</text>
  <text x="624" y="350" font-size="10.5" fill="#12306f">one answer from all</text>
  <text x="624" y="365" font-size="10.5" fill="#12306f">task outputs</text>
  <text x="624" y="380" font-size="10.5" fill="#12306f">+ memory summary</text>

  <path d="M 194 353 L 216 353" stroke="#5b6070" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 354 353 L 376 353" stroke="#1f9d63" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <path d="M 582 353 L 604 353" stroke="#2f6df6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- worker loops back to dispatcher -->
  <path d="M 482 406 L 482 428 L 288 428 L 288 398" stroke="#5b6070" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="330" y="443" font-size="10.5" fill="#666c7c">every finished task re-opens the question "what is runnable now?"</text>

  <text x="44" y="470" font-size="11" fill="#666c7c">Each node publishes trace events; the orchestrator records every one to Postgres and fans it out over SSE.</text>
  <text x="44" y="488" font-size="11" fill="#666c7c">The graph has four nodes no matter how many agents the plan uses — parallelism comes from the plan, not the topology.</text>

  <path d="M 730 242 L 730 266" stroke="#c8912a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="742" y="258" font-size="10.5" fill="#7a5a12">loaded + embedded at startup</text>
  <path d="M 430 230 L 430 264" stroke="#2f6df6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- ============ MCP ============ -->
  <rect x="880" y="270" width="176" height="230" rx="10" fill="#f7f8fb" stroke="#c9ccd6"/>
  <text x="896" y="293" font-size="12" font-weight="700" fill="#5b6070">MCP SERVERS</text>
  <rect x="896" y="306" width="144" height="76" rx="6" fill="#ffffff" stroke="#e0e2e9"/>
  <text x="906" y="324" font-size="11.5" font-weight="600" fill="#171a21">jira (stdio)</text>
  <text x="906" y="341" font-size="10" fill="#666c7c" font-family="ui-monospace, monospace">get_sprints</text>
  <text x="906" y="355" font-size="10" fill="#666c7c" font-family="ui-monospace, monospace">get_sprint_issues</text>
  <text x="906" y="369" font-size="10" fill="#666c7c" font-family="ui-monospace, monospace">get_team_capacity</text>
  <rect x="896" y="388" width="144" height="34" rx="6" fill="#fffaf0" stroke="#f0d9a8"/>
  <text x="906" y="402" font-size="10" fill="#7a5a12" font-family="ui-monospace, monospace">publish_sprint_plan</text>
  <text x="906" y="415" font-size="9.5" fill="#7a5a12">write · needs approval</text>
  <text x="896" y="443" font-size="10.5" fill="#666c7c">list_tools() at startup;</text>
  <text x="896" y="457" font-size="10.5" fill="#666c7c">schemas never hardcoded.</text>
  <text x="896" y="475" font-size="10.5" fill="#666c7c">Timeout + retry per call.</text>

  <!-- Routed below the synthesizer box (which ends at y=396) rather than through it. -->
  <path d="M 584 402 L 874 402" stroke="#1f9d63" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="690" y="417" font-size="10.5" fill="#1f9d63">tool call</text>

  <!-- ============ Postgres ============ -->
  <rect x="24" y="530" width="1032" height="160" rx="10" fill="#f7f8fb" stroke="#c9ccd6"/>
  <text x="40" y="553" font-size="12" font-weight="700" fill="#5b6070">POSTGRES + PGVECTOR — one store, three memory tiers</text>

  <rect x="44" y="566" width="320" height="104" rx="8" fill="#ffffff" stroke="#e0e2e9"/>
  <text x="58" y="587" font-size="12.5" font-weight="700" fill="#171a21">Working</text>
  <text x="58" y="606" font-size="11" fill="#666c7c">LangGraph Postgres checkpointer</text>
  <text x="58" y="623" font-size="11" fill="#666c7c">Resumes a run paused at an approval,</text>
  <text x="58" y="639" font-size="11" fill="#666c7c">and survives a process restart.</text>
  <text x="58" y="658" font-size="10.5" fill="#2f6df6">thread_id = run_id</text>

  <rect x="378" y="566" width="320" height="104" rx="8" fill="#ffffff" stroke="#e0e2e9"/>
  <text x="392" y="587" font-size="12.5" font-weight="700" fill="#171a21">Episodic</text>
  <text x="392" y="606" font-size="11" fill="#666c7c">runs + steps tables</text>
  <text x="392" y="623" font-size="11" fill="#666c7c">Durable trace for replay, cost history</text>
  <text x="392" y="639" font-size="11" fill="#666c7c">and GET /runs/{id} after the bus forgets.</text>
  <text x="392" y="658" font-size="10.5" fill="#2f6df6">every SSE event written here too</text>

  <rect x="712" y="566" width="324" height="104" rx="8" fill="#ffffff" stroke="#e0e2e9"/>
  <text x="726" y="587" font-size="12.5" font-weight="700" fill="#171a21">Semantic</text>
  <text x="726" y="606" font-size="11" fill="#666c7c">pgvector over goal embeddings</text>
  <text x="726" y="623" font-size="11" fill="#666c7c">Similar completed runs are injected into</text>
  <text x="726" y="639" font-size="11" fill="#666c7c">the planner prompt as prior art.</text>
  <text x="726" y="658" font-size="10.5" fill="#2f6df6">cosine distance, top-k</text>

  <path d="M 200 500 L 200 524" stroke="#5b6070" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M 540 500 L 540 524" stroke="#5b6070" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M 700 524 L 700 500" stroke="#5b6070" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
