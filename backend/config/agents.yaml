# The capability registry.
#
# These are NOT agents. Each record is an envelope: what a class of agent is
# permitted to do, and the policy it must obey. There is deliberately no system
# prompt here -- agents, including their prompts, are written by the planner at
# runtime and validated against these envelopes. See app/agents/composer.py.
#
# `description` is the field the planner searches. Write it as a description of
# capability -- what can be found out or worked out -- because it is embedded
# and matched against the user's goal. A job title retrieves badly.
#
# `allowed_tool_selectors` are fnmatch globs over namespaced tool names
# (`<server>.<tool>`). They are a ceiling, not an assignment: a synthesized
# agent may request any subset of what these resolve to and nothing else. This
# is the role-based tool permission boundary, and it is the reason a generated
# agent cannot award itself a write tool.

capabilities:
  - id: jira_reporting
    description: >-
      Retrieves and summarizes historical Jira sprint records: which sprints
      closed, how many story points were committed versus completed in each,
      the issue-level breakdown behind those numbers, and the rolling averages
      and velocity trends that follow from them.
    allowed_tool_selectors: ["jira.get_sprints", "jira.get_sprint_issues"]
    allowed_models: ["claude-sonnet-5", "claude-haiku-4-5"]
    default_model: claude-sonnet-5
    max_iterations_limit: 8
    requires_approval: false
    policy: |
      Use the provided tools to fetch real numbers. Never estimate, invent or
      recall a figure you did not retrieve in this task. If a number you need
      was not returned by a tool, say that it was not retrieved.

  - id: capacity_analysis
    description: >-
      Reads who is actually available for the upcoming sprint -- team roster,
      working days, planned time off and role coverage -- and adjusts a raw
      velocity or commitment figure for real availability.
    allowed_tool_selectors: ["jira.get_team_capacity"]
    allowed_models: ["claude-sonnet-5", "claude-haiku-4-5"]
    default_model: claude-sonnet-5
    max_iterations_limit: 6
    requires_approval: false
    policy: |
      Show the availability ratio you derive and the arithmetic behind it, so a
      human can check it. Never estimate a capacity figure you did not retrieve.

  - id: analysis_only
    description: >-
      Reasons over figures and findings that earlier tasks already produced:
      reviewing a proposed plan or commitment for delivery risk, weighing
      trade-offs, and drawing conclusions. Has no tools and retrieves nothing.
    allowed_tool_selectors: []
    allowed_models: ["claude-sonnet-5", "claude-haiku-4-5"]
    default_model: claude-sonnet-5
    max_iterations_limit: 3
    requires_approval: false
    policy: |
      You have no tools. Work only from the objective and the upstream task
      output you were given. Name the evidence behind every claim, and if the
      evidence for something is not present in what you were given, say so
      instead of speculating.

  - id: jira_writeback
    description: >-
      Writes a finalized sprint commitment back to the Jira board, publishing
      the committed point total and its rationale to the team.
    allowed_tool_selectors: ["jira.publish_sprint_plan"]
    allowed_models: ["claude-sonnet-5"]
    default_model: claude-sonnet-5
    max_iterations_limit: 4
    # This envelope mutates a system of record, so every agent built in it
    # pauses for a human first. Set here, never on the synthesized agent.
    requires_approval: true
    policy: |
      This writes to a shared board. Publish exactly the commitment you were
      given -- do not round it, revise it, or add scope of your own. Confirm
      precisely what you published.
